name: Publish PrintFlow

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            if (context.ref !== `refs/tags/v${config.version}`) throw new Error('Tag and application version differ');
            const release = JSON.parse(fs.readFileSync('.github/release.json', 'utf8'));
            if (release.version !== config.version || typeof release.notes !== 'string' || !release.notes.trim()) {
              throw new Error('Release notes missing or version mismatch; use npm run release');
            }
            core.setOutput('notes', release.notes);

      - name: Publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PrintFlow ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: '--bundles nsis'
